<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jashn-E-Raat 2026 · The All-Night Edition</title>
<meta name="description" content="Sirf aamantrit mehmaanon ke liye. Shanivaar, 5 Dec 2026 · Waghville, Hingna.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Jashn-E-Raat 2026 · The All-Night Edition">
<meta property="og:description" content="Sirf aamantrit mehmaanon ke liye · 5 Dec 2026 · Waghville, Hingna">
<meta property="og:image" content="https://jashneraat.com/preview.jpg">
<meta property="og:url" content="https://jashneraat.com/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1a120b">
<link rel="icon" href="icon.png">
<style>
html,body{margin:0;height:100%;background:#1a120b;color:#f3dfb0;font-family:Georgia,serif}
.w{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
.t{font-size:34px;font-weight:900;color:#FFD23F;letter-spacing:.5px;text-shadow:0 2px 0 #7A4A00}
.s{margin-top:6px;font:600 12px/1.4 Arial,sans-serif;letter-spacing:3px;color:#d9a441}
.m{margin-top:28px;font-size:15px;opacity:.85}
.bar{width:160px;height:3px;background:#3a2a17;border-radius:3px;margin:16px auto 0;overflow:hidden}
.bar i{display:block;width:40%;height:100%;background:#FFD23F;animation:r 1.1s ease-in-out infinite}
@keyframes r{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
button{margin-top:18px;padding:12px 26px;border:0;border-radius:10px;background:#e8b84a;color:#1a120b;font:700 14px Arial,sans-serif;letter-spacing:2px}
</style>
</head>
<body>
<div class="w" id="w">
  <div class="t">Jashn-E-Raat</div>
  <div class="s">2026 · THE ALL-NIGHT EDITION</div>
  <div class="m" id="m">Aapka edition chhap raha hai…</div>
  <div class="bar" id="b"><i></i></div>
</div>
<script>
(function(){
  var API='https://script.google.com/macros/s/AKfycbwm6uNuu6Ph4jR7LGjCqbw3Iw7gsQq5zCT0bpzWhlGA02TCHeJkcc3nDLc3lTIyyaNv/exec';
  var KEY='jr26_design';
  function paint(html){document.open();document.write(html);document.close();}
  function fail(){
    var old=null;try{old=localStorage.getItem(KEY)}catch(e){}
    if(old){paint(old);return;}
    document.getElementById('m').textContent='Network dheema hai. Ek baar phir koshish kijiye.';
    document.getElementById('b').style.display='none';
    var bt=document.createElement('button');bt.textContent='PHIR SE KHOLIYE';
    bt.onclick=function(){location.reload()};document.getElementById('w').appendChild(bt);
  }
  var done=false,t=setTimeout(function(){if(!done){done=true;fail();}},25000);
  fetch(API,{method:'POST',body:JSON.stringify({f:'design',a:[]})})
    .then(function(r){return r.json()})
    .then(function(j){
      if(done)return;done=true;clearTimeout(t);
      if(!j||!j.html)return fail();
      try{localStorage.setItem(KEY,j.html)}catch(e){}
      paint(j.html);
    })
    .catch(function(){if(!done){done=true;clearTimeout(t);fail();}});
})();
</script>
</body>
</html>
